services:
  - type: web
    name: crypto-intelligence
    env: python
    buildCommand: pip install -r requirements.txt && ./render-build.sh
    startCommand: gunicorn backend.api.server:socket_app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: NODE_VERSION
        value: "20"
